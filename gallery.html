<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmiLuna Gallery</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="commerce.css" />
    <link rel="stylesheet" href="gallery.css" />
</head>
<body>

<header class="site-header">
    <div class="logo">AMILUNA</div>
    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="collections.html">Collections</a>
        <a href="about.html">About</a>
    </nav>
</header>

<main class="gallery-page">
    <section class="gallery-copy">
        <p class="category-label">Interactive Experience</p>
        <h1 id="experience-title">3D Gallery View</h1>
        <p class="subtext" id="experience-subtext">A guided cinematic walk through the room, moving across each artwork before returning to the center piece.</p>
    </section>

    <section class="tour-showcase" aria-label="AmiLuna gallery walkthrough" style="grid-template-columns: minmax(0, 1fr);">
        <div class="tour-stage">
            <!-- VIEW 1: 3D Canvas Walkthrough -->
            <div id="view-3d-gallery" class="view-content active" style="width: 100%; height: 100%; position: relative;">
                
                <canvas id="gallery-tour-canvas" style="width: 100%; height: 100%; display: block; border-radius: 24px;"></canvas>

                <div class="tour-overlay">
                    <h2 id="tour-step-title">Entrance</h2>
                </div>
                <div class="tour-controls">
                    <button type="button" id="tour-toggle">Pause</button>
                    <button type="button" id="tour-restart">Restart</button>
                </div>
            </div>

        </div>
    </section>
</main>

<script type="module" src="./gallery-tour.js"></script>
<script type="module" src="./commerce-ui.js"></script>
</body>
</html>
